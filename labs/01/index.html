<!doctype html>
<html lang="pt-BR">
<head>
    <title>Formulário de Contato</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HTML da atividade realizada na matéria de programação web do IFF Campos Campus Centro">
</head>
<body>
    <header>
        <div class="titulo">Área de Contato do Cliente</div>
        <nav class="menu">
            <a href="#">Ajuda</a> | <a href="#">Sair | <a href="./index.html"</a>Portfólio Principal
        </nav>
    </header>

    <main id="corpo-da-pagina">
        <h2 class="subtitulo">Envie sua mensagem para a nossa equipe de suporte backend</h2>
        <article>
            <form action="/enviar" method="POST">
                <label for="nome"> Nome: </label> <input required minlength="5" type="text" id="nome" name="nome"><br><br>
                <label for="email"> Email:</label> <input type="email" required minlength="5" id="email" name="email"><br><br>
                <label for="celular"> Telefone Celular:</label> <input required pattern="[0-9]{11}" type="text" id="celular" name="celular"><br><br>
                <label for="msg"> Mensagem:</label> <textarea id="msg" name="msg"></textarea><br><br>
                
                <input type="button" value="Disparar Dados">
        </form>
        </article>
        
    </main>

    <footer id="rodape">
        Suporte Tech 2026
    </footer>
</body>
</html>
