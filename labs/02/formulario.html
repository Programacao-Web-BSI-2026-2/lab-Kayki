<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="HTML, Formuário, Busca Google">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Kayki Santana Guimarães">
    <title>Formulário - Buscador</title>
</head>
<body>
    <form action="https://google.com.br/search" method="GET">
        <label for="item-pesquisa">Pesquisar:</label>
        <input placeholder="Digite aqui sua consulta" name="q" type="search">
        <button type="submit">Buscar</button>
        <button type="reset">Limpar</button>
    </form>
</body>
</html>
